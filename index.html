<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>CROWN 3D COLLECTION by EBONIX</title>
  <link rel="stylesheet" href="style.css" />

  <!-- A-Frame (must load before MindAR) -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!-- MindAR image-tracking A-Frame integration -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <!-- PS1 aesthetic: vertex snapping + affine texture warp -->
  <script>
    AFRAME.registerComponent('ps1-shader', {
      schema: {
        snapResolution: { type: 'number', default: 80 }  // lower = chunkier snap
      },
      init: function () {
        const res = this.data.snapResolution;
        this.el.addEventListener('model-loaded', () => {
          this.el.object3D.traverse((child) => {
            if (!child.isMesh) return;
            child.material.onBeforeCompile = (shader) => {
              // Vertex snap: quantise clip-space positions to a grid
              shader.vertexShader = shader.vertexShader.replace(
                '#include <project_vertex>',
                `
                #include <project_vertex>
                float snapRes = ${res.toFixed(1)};
                // Snap x/y in clip space to simulate low-res vertex pipeline
                gl_Position.xyz /= gl_Position.w;
                gl_Position.x = floor(gl_Position.x * snapRes + 0.5) / snapRes;
                gl_Position.y = floor(gl_Position.y * snapRes + 0.5) / snapRes;
                gl_Position.xyz *= gl_Position.w;
                `
              );
            };
            // Flat shading for faceted PS1 look
            child.material.flatShading = true;
            child.material.needsUpdate = true;
          });
        });
      }
    });
  </script>
</head>
<body>

  <!-- ============ LOADING OVERLAY ============ -->
  <div id="loading-overlay">
    <div class="loading-content">
      <h1 class="loading-title">
        <span class="title-crown">CROWN</span><span class="title-3d">3D</span><span class="title-collection">COLLECTION</span>
      </h1>
      <p class="loading-subtitle">by EBONIX</p>
      <div class="loading-spinner"></div>
      <p class="loading-instruction">Point your camera at a card</p>
    </div>
  </div>

  <!-- ============ PHOTO CAPTURE BUTTON ============ -->
  <button id="photo-btn" type="button" aria-label="Take photo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 8.6A1.6 1.6 0 0 1 4.6 7h2.1a1.6 1.6 0 0 0 1.37-.78l.72-1.2A1.6 1.6 0 0 1 10.16 4.2h3.68a1.6 1.6 0 0 1 1.37.78l.72 1.2A1.6 1.6 0 0 0 17.3 7h2.1A1.6 1.6 0 0 1 21 8.6v8.8a1.6 1.6 0 0 1-1.6 1.6H4.6A1.6 1.6 0 0 1 3 17.4z"/>
      <circle cx="12" cy="13" r="3.5"/>
    </svg>
  </button>

  <!-- Capture flash -->
  <div id="capture-flash" aria-hidden="true"></div>

  <!-- ============ PERSISTENT WATERMARK ============ -->
  <div id="watermark">CROWN<span class="wm-3d">3D</span>COLLECTION <span class="wm-by">by EBONIX</span></div>

  <!-- ============ A-FRAME AR SCENE ============ -->
  <a-scene
    mindar-image="imageTargetSrc: assets/targets.mind; maxTrack: 2; filterMinCF: 0.001; filterBeta: 1000;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <!-- Preload GLB models -->
    <a-assets>
      <a-asset-item id="model-blue-magic" src="assets/001-blue-magic.glb"></a-asset-item>
      <a-asset-item id="model-hot-comb" src="assets/002-hot-comb.glb"></a-asset-item>
      <a-asset-item id="model-afro-pick" src="assets/003-afro-pick.glb"></a-asset-item>
      <a-asset-item id="model-hair-relaxer" src="assets/004-hair-relaxer.glb"></a-asset-item>
      <a-asset-item id="model-got2b-glued" src="assets/005-got2b-glued.glb"></a-asset-item>
    </a-assets>

    <!-- Camera -->
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Lighting: ambient + directional for contrasty PS1 look -->
    <a-light type="ambient" color="#ffffff" intensity="0.6"></a-light>
    <a-light type="directional" color="#ffe8c0" intensity="1.2" position="1 2 1"></a-light>

    <!-- Target 0 — Blue Magic -->
    <a-entity mindar-image-target="targetIndex: 0">
      <a-entity
        position="0 0.5 0"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear"
        animation__bob="property: position; from: 0 0.45 0; to: 0 0.55 0; loop: true; dir: alternate; dur: 2000; easing: easeInOutSine"
      >
        <a-gltf-model
          src="#model-blue-magic"
          rotation="-90 0 0"
          scale="3.45 3.45 3.45"
          ps1-shader="snapResolution: 256"
        ></a-gltf-model>
      </a-entity>
    </a-entity>

    <!-- Target 1 — Hot Comb -->
    <a-entity mindar-image-target="targetIndex: 1">
      <a-entity
        position="0 0.5 0"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear"
        animation__bob="property: position; from: 0 0.45 0; to: 0 0.55 0; loop: true; dir: alternate; dur: 2000; easing: easeInOutSine"
      >
        <a-gltf-model
          src="#model-hot-comb"
          rotation="-90 0 0"
          scale="2.48 2.48 2.48"
          ps1-shader="snapResolution: 256"
        ></a-gltf-model>
      </a-entity>
    </a-entity>

    <!-- Target 2 — Afro Pick -->
    <a-entity mindar-image-target="targetIndex: 2">
      <a-entity
        position="0 0.5 0"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear"
        animation__bob="property: position; from: 0 0.45 0; to: 0 0.55 0; loop: true; dir: alternate; dur: 2000; easing: easeInOutSine"
      >
        <a-gltf-model
          src="#model-afro-pick"
          rotation="-90 0 0"
          scale="0.2 0.2 0.2"
          ps1-shader="snapResolution: 256"
        ></a-gltf-model>
      </a-entity>
    </a-entity>

    <!-- Target 3 — Hair Relaxer -->
    <a-entity mindar-image-target="targetIndex: 3">
      <a-entity
        position="0 0.5 0"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear"
        animation__bob="property: position; from: 0 0.45 0; to: 0 0.55 0; loop: true; dir: alternate; dur: 2000; easing: easeInOutSine"
      >
        <a-gltf-model
          src="#model-hair-relaxer"
          rotation="-90 0 0"
          scale="0.2 0.2 0.2"
          ps1-shader="snapResolution: 256"
        ></a-gltf-model>
      </a-entity>
    </a-entity>

    <!-- Target 4 — Got2b Glued -->
    <a-entity mindar-image-target="targetIndex: 4">
      <a-entity
        position="0 0.5 0"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear"
        animation__bob="property: position; from: 0 0.45 0; to: 0 0.55 0; loop: true; dir: alternate; dur: 2000; easing: easeInOutSine"
      >
        <a-gltf-model
          src="#model-got2b-glued"
          rotation="-90 0 0"
          scale="1.99 1.99 1.99"
          ps1-shader="snapResolution: 256"
        ></a-gltf-model>
      </a-entity>
    </a-entity>
  </a-scene>

  <!-- ============ OVERLAY FADE LOGIC ============ -->
  <script>
    const sceneEl = document.querySelector('a-scene');
    const overlay = document.getElementById('loading-overlay');

    sceneEl.addEventListener('arReady', () => {
      overlay.classList.add('hidden');
    });

    // Fallback: hide after 8s if arReady never fires (e.g. desktop testing)
    setTimeout(() => {
      overlay.classList.add('hidden');
    }, 8000);
  </script>
  <!-- ============ PHOTO CAPTURE ============ -->
  <script>
    (function () {
      const btn = document.getElementById('photo-btn');
      const flash = document.getElementById('capture-flash');

      // Composite MindAR's camera video + the WebGL layer into one canvas.
      function composite() {
        const scene = document.querySelector('a-scene');
        const gl = scene && scene.renderer && scene.renderer.domElement;
        const video = document.querySelector('video');
        if (!gl) return null;

        const out = document.createElement('canvas');
        out.width = gl.width;
        out.height = gl.height;
        const ctx = out.getContext('2d');

        // CSS pixels -> canvas pixels
        const s = gl.clientWidth ? gl.width / gl.clientWidth : 1;

        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, out.width, out.height);

        // Camera frame first, using MindAR's own computed geometry
        if (video && video.videoWidth) {
          ctx.drawImage(
            video,
            video.offsetLeft * s, video.offsetTop * s,
            video.offsetWidth * s, video.offsetHeight * s
          );
        }

        // 3D layer on top.
        // The WebGL buffer is cleared once the browser composites, so re-render
        // now and read it in the same synchronous block while it's still valid.
        try {
          scene.renderer.render(scene.object3D, scene.camera);
        } catch (e) {
          console.error('Re-render before capture failed:', e);
        }
        ctx.drawImage(gl, 0, 0, out.width, out.height);
        return out;
      }

      function dataURLtoBlob(dataURL) {
        const [head, b64] = dataURL.split(',');
        const mime = head.match(/:(.*?);/)[1];
        const bin = atob(b64);
        const buf = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
        return new Blob([buf], { type: mime });
      }

      function filename() {
        const d = new Date();
        const p = (n) => String(n).padStart(2, '0');
        return `crown3d-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}` +
               `-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.png`;
      }

      btn.addEventListener('click', function () {
        const canvas = composite();
        if (!canvas) return;

        // Everything below stays synchronous: iOS drops the user-gesture
        // grant across an await, which makes navigator.share throw.
        let blob;
        try {
          blob = dataURLtoBlob(canvas.toDataURL('image/png'));
        } catch (e) {
          console.error('Capture failed:', e);
          return;
        }

        flash.classList.add('firing');
        setTimeout(() => flash.classList.remove('firing'), 320);

        const name = filename();
        const file = new File([blob], name, { type: 'image/png' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          // iOS: opens the share sheet -> "Save Image" writes to Photos
          navigator.share({ files: [file], title: 'CROWN 3D COLLECTION' })
            .catch(() => {});
        } else {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = name;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 4000);
        }
      });
    })();
  </script>

</body>
</html>
