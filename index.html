<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>CROWN 3D COLLECTION by EBONIX</title>
  <link rel="stylesheet" href="style.css" />

  <!-- A-Frame (must load before MindAR) -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!-- MindAR image-tracking A-Frame integration -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <!-- PS1 aesthetic: vertex snapping + affine texture warp -->
  <script>
    AFRAME.registerComponent('ps1-shader', {
      schema: {
        snapResolution: { type: 'number', default: 80 }  // lower = chunkier snap
      },
      init: function () {
        const res = this.data.snapResolution;
        this.el.addEventListener('model-loaded', () => {
          this.el.object3D.traverse((child) => {
            if (!child.isMesh) return;
            child.material.onBeforeCompile = (shader) => {
              // Vertex snap: quantise clip-space positions to a grid
              shader.vertexShader = shader.vertexShader.replace(
                '#include <project_vertex>',
                `
                #include <project_vertex>
                float snapRes = ${res.toFixed(1)};
                // Snap x/y in clip space to simulate low-res vertex pipeline
                gl_Position.xyz /= gl_Position.w;
                gl_Position.x = floor(gl_Position.x * snapRes + 0.5) / snapRes;
                gl_Position.y = floor(gl_Position.y * snapRes + 0.5) / snapRes;
                gl_Position.xyz *= gl_Position.w;
                `
              );
            };
            // Flat shading for faceted PS1 look
            child.material.flatShading = true;
            child.material.needsUpdate = true;
          });
        });
      }
    });
  </script>
</head>
<body>

  <!-- ============ LOADING OVERLAY ============ -->
  <div id="loading-overlay">
    <div class="loading-content">
      <h1 class="loading-title">
        <span class="title-crown">CROWN</span><span class="title-3d">3D</span><span class="title-collection">COLLECTION</span>
      </h1>
      <p class="loading-subtitle">by EBONIX</p>
      <div class="loading-spinner"></div>
      <p class="loading-instruction">Point your camera at a card</p>
    </div>
  </div>

  <!-- ============ PERSISTENT WATERMARK ============ -->
  <div id="watermark">CROWN<span class="wm-3d">3D</span>COLLECTION <span class="wm-by">by EBONIX</span></div>

  <!-- ============ A-FRAME AR SCENE ============ -->
  <a-scene
    mindar-image="imageTargetSrc: assets/targets.mind; maxTrack: 2; filterMinCF: 0.001; filterBeta: 1000;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <!-- Preload GLB models -->
    <a-assets>
      <a-asset-item id="model-blue-magic" src="assets/001-blue-magic.glb"></a-asset-item>
      <a-asset-item id="model-hot-comb" src="assets/002-hot-comb.glb"></a-asset-item>
      <a-asset-item id="model-afro-pick" src="assets/003-afro-pick.glb"></a-asset-item>
      <a-asset-item id="model-hair-relaxer" src="assets/004-hair-relaxer.glb"></a-asset-item>
      <a-asset-item id="model-got2b-glued" src="assets/005-got2b-glued.glb"></a-asset-item>
    </a-assets>

    <!-- Camera -->
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Lighting: ambient + directional for contrasty PS1 look -->
    <a-light type="ambient" color="#ffffff" intensity="0.6"></a-light>
    <a-light type="directional" color="#ffe8c0" intensity="1.2" position="1 2 1"></a-light>

    <!-- Target 0 — Blue Magic -->
    <a-entity mindar-image-target="targetIndex: 0">
      <a-gltf-model
        src="#model-blue-magic"
        position="0 0.5 0"
        scale="0.2 0.2 0.2"
        ps1-shader="snapResolution: 80"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear"
        animation__bob="property: position; from: 0 0.45 0; to: 0 0.55 0; loop: true; dir: alternate; dur: 2000; easing: easeInOutSine"
      ></a-gltf-model>
    </a-entity>

    <!-- Target 1 — Hot Comb -->
    <a-entity mindar-image-target="targetIndex: 1">
      <a-gltf-model
        src="#model-hot-comb"
        position="0 0.5 0"
        scale="0.2 0.2 0.2"
        ps1-shader="snapResolution: 80"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear"
        animation__bob="property: position; from: 0 0.45 0; to: 0 0.55 0; loop: true; dir: alternate; dur: 2000; easing: easeInOutSine"
      ></a-gltf-model>
    </a-entity>

    <!-- Target 2 — Afro Pick -->
    <a-entity mindar-image-target="targetIndex: 2">
      <a-gltf-model
        src="#model-afro-pick"
        position="0 0.5 0"
        scale="0.2 0.2 0.2"
        ps1-shader="snapResolution: 80"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear"
        animation__bob="property: position; from: 0 0.45 0; to: 0 0.55 0; loop: true; dir: alternate; dur: 2000; easing: easeInOutSine"
      ></a-gltf-model>
    </a-entity>

    <!-- Target 3 — Hair Relaxer -->
    <a-entity mindar-image-target="targetIndex: 3">
      <a-gltf-model
        src="#model-hair-relaxer"
        position="0 0.5 0"
        scale="0.2 0.2 0.2"
        ps1-shader="snapResolution: 80"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear"
        animation__bob="property: position; from: 0 0.45 0; to: 0 0.55 0; loop: true; dir: alternate; dur: 2000; easing: easeInOutSine"
      ></a-gltf-model>
    </a-entity>

    <!-- Target 4 — Got2b Glued -->
    <a-entity mindar-image-target="targetIndex: 4">
      <a-gltf-model
        src="#model-got2b-glued"
        position="0 0.5 0"
        scale="0.2 0.2 0.2"
        ps1-shader="snapResolution: 80"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear"
        animation__bob="property: position; from: 0 0.45 0; to: 0 0.55 0; loop: true; dir: alternate; dur: 2000; easing: easeInOutSine"
      ></a-gltf-model>
    </a-entity>
  </a-scene>

  <!-- ============ OVERLAY FADE LOGIC ============ -->
  <script>
    const sceneEl = document.querySelector('a-scene');
    const overlay = document.getElementById('loading-overlay');

    sceneEl.addEventListener('arReady', () => {
      overlay.classList.add('hidden');
    });

    // Fallback: hide after 8s if arReady never fires (e.g. desktop testing)
    setTimeout(() => {
      overlay.classList.add('hidden');
    }, 8000);
  </script>

</body>
</html>
