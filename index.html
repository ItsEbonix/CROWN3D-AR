<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>CROWN 3D COLLECTION by EBONIX</title>
  <link rel="stylesheet" href="style.css" />

  <!-- A-Frame (must load before MindAR) -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!-- aframe-extras: provides animation-mixer for the GLB "Idle" clips -->
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
  <!-- MindAR image-tracking A-Frame integration -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <!-- PS1 aesthetic: vertex snapping + affine texture warp -->
  <script>
    AFRAME.registerComponent('ps1-shader', {
      schema: {
        snapResolution: { type: 'number', default: 80 }  // lower = chunkier snap
      },
      init: function () {
        const res = this.data.snapResolution;
        this.el.addEventListener('model-loaded', () => {
          this.el.object3D.traverse((child) => {
            if (!child.isMesh) return;
            child.material.onBeforeCompile = (shader) => {
              // snapResolution 0 disables snapping; injecting it would
              // divide by zero in GLSL and blank the geometry.
              if (res <= 0) return;
              // Vertex snap: quantise clip-space positions to a grid
              shader.vertexShader = shader.vertexShader.replace(
                '#include <project_vertex>',
                `
                #include <project_vertex>
                float snapRes = ${res.toFixed(1)};
                // Snap x/y in clip space to simulate low-res vertex pipeline
                gl_Position.xyz /= gl_Position.w;
                gl_Position.x = floor(gl_Position.x * snapRes + 0.5) / snapRes;
                gl_Position.y = floor(gl_Position.y * snapRes + 0.5) / snapRes;
                gl_Position.xyz *= gl_Position.w;
                `
              );
            };
            // Flat shading for faceted PS1 look
            child.material.flatShading = true;
            child.material.needsUpdate = true;
          });
        });
      }
    });
  </script>  <!-- Stabilisation + freeze. MindAR writes each target's (OneEuro-filtered)
       pose onto its matrix every frame; re-solving every frame is what makes a
       held card jitter. This component:
         1) eases onto the card on acquire (damped follow),
         2) after the pose is stable for `settle` ms, FREEZES — captures the
            world pose and pins the model there, killing jitter completely,
         3) stays frozen while the card is visible, even if the phone moves
            (pinned in place — by design it will not re-stick to a moved card),
         4) unfreezes only after the target has been lost continuously for
            `grace` ms; the next acquire re-runs the cycle.
       The spin/bob animation lives on the child model, so it keeps playing
       while the wrapper is frozen. Lock math verified: world pose held to ~0. -->
  <script>
    AFRAME.registerComponent('damp', {
      schema: {
        amount: { type: 'number', default: 0.5 },    // follow smoothing 0..~0.97
        settle: { type: 'number', default: 100 },     // ms stable before freezing
        grace:  { type: 'number', default: 10000 }    // ms lost before unfreezing
      },

      init: function () {
        const THREE = AFRAME.THREE;
        this.target = this.el.parentEl;              // the mindar-image-target
        this.targetObj = this.target.object3D;
        this.obj = this.el.object3D;

        // Optional per-session overrides: ?damp=0.9&settle=700&grace=5000
        var q = new URLSearchParams(location.search);
        ['amount:damp', 'settle:settle', 'grace:grace'].forEach((pair) => {
          var k = pair.split(':'), v = parseFloat(q.get(k[1]));
          if (isFinite(v)) this.el.setAttribute('damp', k[0], v);
        });

        this.basePos = this.obj.position.clone();
        this.baseQuat = this.obj.quaternion.clone();
        this.baseScale = this.obj.scale.clone();
        this.baseMat = new THREE.Matrix4().compose(this.basePos, this.baseQuat, this.baseScale);

        this.smPos = new THREE.Vector3();
        this.smQuat = new THREE.Quaternion();
        this.primed = false;

        // Freeze state
        this.locked = false;
        this.frozenWorld = new THREE.Matrix4();      // captured world pose
        this.stableSince = 0;
        this.lostSince = 0;

        this._p = new THREE.Vector3();
        this._q = new THREE.Quaternion();
        this._s = new THREE.Vector3();
        this._m = new THREE.Matrix4();

        this.target.addEventListener('targetFound', () => {
          this.primed = false;
          this.locked = false;
          this.stableSince = 0;
          this.lostSince = 0;
        });
        this.target.addEventListener('targetLost', () => {
          this.lostSince = performance.now();
        });
      },

      tick: function (time) {
        const THREE = AFRAME.THREE;
        const visible = this.targetObj && this.targetObj.visible;

        // ---- FROZEN: hold the captured world pose regardless of tracking ----
        if (this.locked) {
          // Unfreeze only after the card has been gone continuously for `grace`.
          if (!visible && this.lostSince && (performance.now() - this.lostSince > this.data.grace)) {
            this.locked = false;
            this.primed = false;
            return;
          }
          // wrapper local = targetWorld⁻¹ · frozenWorld  → world pose stays put.
          this._m.copy(this.targetObj.matrix).invert().multiply(this.frozenWorld);
          this._m.decompose(this.obj.position, this.obj.quaternion, this.obj.scale);
          return;
        }

        // ---- FOLLOWING: damped ease toward the tracked pose ----
        if (!visible) return;
        this.lostSince = 0;

        this.targetObj.matrix.decompose(this._p, this._q, this._s);
        const a = Math.max(0, Math.min(0.97, this.data.amount));
        const follow = 1 - a;

        if (!this.primed) {
          this.smPos.copy(this._p);
          this.smQuat.copy(this._q);
          this.primed = true;
          this.stableSince = time;
        } else {
          this.smPos.lerp(this._p, follow);
          this.smQuat.slerp(this._q, follow);
        }

        // Render smoothed pose (residual against raw) with base on top.
        this._q.invert();
        this.obj.quaternion.copy(this.smQuat).multiply(this._q).multiply(this.baseQuat);
        this._p.sub(this.smPos).multiplyScalar(-1);
        this.obj.position.copy(this.basePos).add(this._p);
        this.obj.scale.copy(this.baseScale);

        // Once the smoothed pose has tracked closely for `settle` ms, freeze.
        // Closeness = smoothed vs raw agree (jitter no longer moving them apart).
        this.targetObj.matrix.decompose(this._p, this._q, this._s);
        const posErr = this._p.distanceTo(this.smPos);
        const rotErr = this._q.angleTo(this.smQuat);       // radians
        if (posErr < 0.01 && rotErr < 0.03) {
          if (time - this.stableSince > this.data.settle) {
            // Capture current world pose = targetWorld · (base·smoothed offset).
            this.obj.updateMatrix();
            this.frozenWorld.copy(this.targetObj.matrix).multiply(this.obj.matrix);
            this.locked = true;
          }
        } else {
          this.stableSince = time;   // reset the stability timer on any wobble
        }
      }
    });
  </script>

  <!-- Plays whatever the GLB's first animation clip is called, so exported
       clip renames (Idle, Idle.001, Idle.003 …) don't silently stop playback. -->
  <script>
    AFRAME.registerComponent('play-first-clip', {
      init: function () {
        this.el.addEventListener('model-loaded', (e) => {
          const model = e.detail.model;
          const clips = model && model.animations;
          if (!clips || !clips.length) return;
          // Reuse aframe-extras' mixer by handing it the real clip name.
          this.el.setAttribute('animation-mixer', 'clip: ' + clips[0].name + '; loop: repeat');

          // Speed all clips up 50%. timeScale isn't an attribute in this
          // aframe-extras build, so set it on the THREE mixer directly. The
          // mixer may be created synchronously or a tick later, so try now and
          // once more on the next frame.
          const setSpeed = () => {
            const mc = this.el.components['animation-mixer'];
            if (mc && mc.mixer) { mc.mixer.timeScale = 2.7; return true; }
            return false;
          };
          if (!setSpeed()) requestAnimationFrame(setSpeed);
        });
      }
    });
  </script>

  <!-- Look shader: toon / unlit / posterize / dither + inverted-hull outline -->
  <script>
    AFRAME.registerComponent('crown-shader', {
      schema: {
        mode:         { type: 'string',  default: 'default' },
        bands:        { type: 'number',  default: 3 },
        outline:      { type: 'boolean', default: false },
        outlineWidth: { type: 'number',  default: 0.03 },
        arrowGlow:    { type: 'number',  default: 0 }   // emissive on rim arrow
      },

      init: function () {
        this.orig = new Map();
        this.outlines = [];
        this.el.addEventListener('model-loaded', () => { this.cache(); this.apply(); });
      },

      update: function () { this.apply(); },

      // Remember each mesh's shipped material so every mode stays reversible.
      cache: function () {
        this.orig.clear();
        if (!this.el.object3D) return;
        this.el.object3D.traverse((c) => {
          if (c.isMesh && c.material && !this.orig.has(c.uuid)) this.orig.set(c.uuid, c.material);
        });
      },

      gradientMap: function (steps) {
        const n = Math.max(2, Math.min(8, Math.round(steps)));
        const data = new Uint8Array(n);
        for (let i = 0; i < n; i++) data[i] = Math.round(255 * (i + 1) / n);
        const t = new THREE.DataTexture(data, n, 1, THREE.RedFormat);
        t.minFilter = THREE.NearestFilter;
        t.magFilter = THREE.NearestFilter;
        t.generateMipmaps = false;
        t.needsUpdate = true;
        return t;
      },

      // Quantise (and optionally ordered-dither) the final colour, post-lighting.
      postFX: function (mat, levels, dither) {
        mat.onBeforeCompile = (shader) => {
          shader.fragmentShader = shader.fragmentShader.replace(
            '#include <dithering_fragment>',
            `
            #include <dithering_fragment>
            {
              float lv = ${levels.toFixed(1)};
              float thr = 0.0;
              ${dither ? `
              vec2 dp = floor(gl_FragCoord.xy);
              float di = mod(dp.x + mod(dp.y, 2.0) * 2.0, 4.0);
              thr = (di + 0.5) / 4.0 - 0.5;
              ` : ''}
              gl_FragColor.rgb = floor(gl_FragColor.rgb * lv + 0.5 + thr) / lv;
            }
            `);
        };
        mat.needsUpdate = true;
      },

      clearOutlines: function () {
        this.outlines.forEach((o) => { if (o.parent) o.parent.remove(o); });
        this.outlines = [];
      },

      apply: function () {
        if (!this.el.object3D || this.orig.size === 0) return;
        const THREE = AFRAME.THREE;
        const d = this.data;
        this.clearOutlines();

        this.el.object3D.traverse((c) => {
          if (!c.isMesh) return;
          // The 'rim' node is the repurposed down-arrow. Keep it off the toon
          // material, but optionally give it an emissive glow.
          if (c.name && /rim/i.test(c.name)) {
            if (c.material) {
              const g = this.data.arrowGlow;
              if (!c.material.emissive) c.material.emissive = new THREE.Color(0x000000);
              c.material.emissive.copy(c.material.color || new THREE.Color(0xffd24a));
              c.material.emissiveIntensity = g;
              c.material.needsUpdate = true;
            }
            return;
          }
          const o = this.orig.get(c.uuid);
          if (!o) return;

          if (d.mode === 'toon') {
            c.material = new THREE.MeshToonMaterial({
              color: o.color ? o.color.clone() : new THREE.Color(0xffffff),
              map: o.map || null,
              gradientMap: this.gradientMap(d.bands)
            });
          } else if (d.mode === 'unlit') {
            c.material = new THREE.MeshBasicMaterial({
              color: o.color ? o.color.clone() : new THREE.Color(0xffffff),
              map: o.map || null
            });
          } else if (d.mode === 'posterize' || d.mode === 'dither') {
            const m = o.clone();
            m.flatShading = true;
            this.postFX(m, d.bands * 2, d.mode === 'dither');
            c.material = m;
          } else {
            c.material = o;                 // default: restore original
            o.flatShading = true;
            o.needsUpdate = true;
          }
        });

        if (d.outline) this.buildOutlines();
      },

      // Inverted hull: clone each mesh, scale it up, render back faces in black.
      buildOutlines: function () {
        const w = this.data.outlineWidth;
        const meshes = [];
        this.el.object3D.traverse((c) => { if (c.isMesh && !/rim/i.test(c.name || '')) meshes.push(c); });
        meshes.forEach((m) => {
          const shell = new THREE.Mesh(
            m.geometry,
            new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.BackSide })
          );
          shell.scale.set(1 + w, 1 + w, 1 + w);
          m.add(shell);
          this.outlines.push(shell);
        });
      }
    });
  </script>

</head>

  <!-- ============ OVERLAY FADE LOGIC ============ -->
  <script>
    const sceneEl = document.querySelector('a-scene');
    const overlay = document.getElementById('loading-overlay');

    sceneEl.addEventListener('arReady', () => {
      overlay.classList.add('hidden');
    });

    // Fallback: hide after 8s if arReady never fires (e.g. desktop testing)
    setTimeout(() => {
      overlay.classList.add('hidden');
    }, 8000);
  </script>
  <!-- ============ PHOTO CAPTURE ============ -->
  <script>
    (function () {
      const btn = document.getElementById('photo-btn');
      const flash = document.getElementById('capture-flash');

      // Composite MindAR's camera video + the WebGL layer into one canvas.
      function composite() {
        const scene = document.querySelector('a-scene');
        const gl = scene && scene.renderer && scene.renderer.domElement;
        const video = document.querySelector('video');
        if (!gl) return null;

        const out = document.createElement('canvas');
        out.width = gl.width;
        out.height = gl.height;
        const ctx = out.getContext('2d');

        // CSS pixels -> canvas pixels
        const s = gl.clientWidth ? gl.width / gl.clientWidth : 1;

        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, out.width, out.height);

        // Camera frame first, using MindAR's own computed geometry
        if (video && video.videoWidth) {
          ctx.drawImage(
            video,
            video.offsetLeft * s, video.offsetTop * s,
            video.offsetWidth * s, video.offsetHeight * s
          );
        }

        // 3D layer on top.
        // The WebGL buffer is cleared once the browser composites, so re-render
        // now and read it in the same synchronous block while it's still valid.
        try {
          scene.renderer.render(scene.object3D, scene.camera);
        } catch (e) {
          console.error('Re-render before capture failed:', e);
        }
        ctx.drawImage(gl, 0, 0, out.width, out.height);

        // Match the live CRT overlay so saved photos look like what's on screen.
        var fx = window.CROWN_POSTFX;
        if (fx && fx.crt > 0) {
          var W = out.width, H = out.height;
          // Scanlines
          ctx.globalAlpha = 0.28 * fx.crt;
          ctx.fillStyle = '#000';
          for (var y = 0; y < H; y += 3) ctx.fillRect(0, y, W, 1);
          ctx.globalAlpha = 1;
          // Vignette
          var g = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.3, W/2, H/2, Math.max(W,H)*0.6);
          g.addColorStop(0, 'rgba(0,0,0,0)');
          g.addColorStop(1, 'rgba(0,0,0,' + (0.5 * fx.crt).toFixed(3) + ')');
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, W, H);
        }
        return out;
      }

      function dataURLtoBlob(dataURL) {
        const [head, b64] = dataURL.split(',');
        const mime = head.match(/:(.*?);/)[1];
        const bin = atob(b64);
        const buf = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
        return new Blob([buf], { type: mime });
      }

      function filename() {
        const d = new Date();
        const p = (n) => String(n).padStart(2, '0');
        return `crown3d-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}` +
               `-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.png`;
      }

      btn.addEventListener('click', function () {
        const canvas = composite();
        if (!canvas) return;

        // Everything below stays synchronous: iOS drops the user-gesture
        // grant across an await, which makes navigator.share throw.
        let blob;
        try {
          blob = dataURLtoBlob(canvas.toDataURL('image/png'));
        } catch (e) {
          console.error('Capture failed:', e);
          return;
        }

        flash.classList.add('firing');
        setTimeout(() => flash.classList.remove('firing'), 320);

        const name = filename();
        const file = new File([blob], name, { type: 'image/png' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          // iOS: opens the share sheet -> "Save Image" writes to Photos
          navigator.share({ files: [file], title: 'CROWN 3D COLLECTION' })
            .catch(() => {});
        } else {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = name;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 4000);
        }
      });
    })();
  </script>
  <!-- ============ POST-FX: pixelation + CRT overlay ============ -->
  <div id="crt-overlay" aria-hidden="true"></div>
  <script>
    (function () {
      // Screen pixelation: render at a lower pixel ratio, upscale hard-edged.
      // CRT: a scanline + vignette overlay on top of the whole view (which
      // includes MindAR's camera video, since the overlay sits above it).
      var PIXEL = 2;      // 1 = crisp, higher = chunkier
      var CRT   = 0.15;   // 0 = off .. 1 = strong

      var scene = document.querySelector('a-scene');

      function applyPixel() {
        var r = scene.renderer, c = scene.canvas;
        if (r && PIXEL > 1) {
          var base = Math.min(window.devicePixelRatio || 1, 2);
          r.setPixelRatio(base / PIXEL);
          if (c) c.style.imageRendering = 'pixelated';
        }
      }
      // MindAR resets the renderer size when AR starts, so (re)apply after ready.
      scene.addEventListener('renderstart', applyPixel);
      scene.addEventListener('arReady', applyPixel);

      var ov = document.getElementById('crt-overlay');
      ov.style.opacity = CRT;

      // Expose for the photo capture so saved shots match the live view.
      window.CROWN_POSTFX = { pixel: PIXEL, crt: CRT };
    })();
  </script>

</body>
</html>
