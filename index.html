<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>CROWN3D CARDS</title>
  <link rel="stylesheet" href="style.css" />

  <!-- A-Frame (must load before MindAR) -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!-- aframe-extras: provides animation-mixer for the GLB "Idle" clips -->
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
  <!-- gif.js: GIF encoder for the AR recording feature -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
  <!-- MindAR image-tracking A-Frame integration -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <!-- PS1 aesthetic: vertex snapping + affine texture warp -->
  <script>
    AFRAME.registerComponent('ps1-shader', {
      schema: {
        snapResolution: { type: 'number', default: 80 }  // lower = chunkier snap
      },
      init: function () {
        const res = this.data.snapResolution;
        this.el.addEventListener('model-loaded', () => {
          this.el.object3D.traverse((child) => {
            if (!child.isMesh) return;
            child.material.onBeforeCompile = (shader) => {
              // snapResolution 0 disables snapping; injecting it would
              // divide by zero in GLSL and blank the geometry.
              if (res <= 0) return;
              // Vertex snap: quantise clip-space positions to a grid
              shader.vertexShader = shader.vertexShader.replace(
                '#include <project_vertex>',
                `
                #include <project_vertex>
                float snapRes = ${res.toFixed(1)};
                // Snap x/y in clip space to simulate low-res vertex pipeline
                gl_Position.xyz /= gl_Position.w;
                gl_Position.x = floor(gl_Position.x * snapRes + 0.5) / snapRes;
                gl_Position.y = floor(gl_Position.y * snapRes + 0.5) / snapRes;
                gl_Position.xyz *= gl_Position.w;
                `
              );
            };
            // Flat shading for faceted PS1 look
            child.material.flatShading = true;
            child.material.needsUpdate = true;
          });
        });
      }
    });
  </script>  <!-- Stabilisation + freeze. MindAR writes each target's (OneEuro-filtered)
       pose onto its matrix every frame; re-solving every frame is what makes a
       held card jitter. This component:
         1) eases onto the card on acquire (damped follow),
         2) after the pose is stable for `settle` ms, FREEZES — captures the
            world pose and pins the model there, killing jitter completely,
         3) stays frozen while the card is visible, even if the phone moves
            (pinned in place — by design it will not re-stick to a moved card),
         4) unfreezes only after the target has been lost continuously for
            `grace` ms; the next acquire re-runs the cycle.
       The spin/bob animation lives on the child model, so it keeps playing
       while the wrapper is frozen. Lock math verified: world pose held to ~0. -->
  <script>
    AFRAME.registerComponent('damp', {
      schema: {
        amount: { type: 'number', default: 0.5 },    // follow smoothing 0..~0.97
        settle: { type: 'number', default: 400 },     // ms stable before freezing
        grace:  { type: 'number', default: 10000 }    // ms lost before unfreezing
      },

      init: function () {
        const THREE = AFRAME.THREE;
        this.target = this.el.parentEl;              // the mindar-image-target
        this.targetObj = this.target.object3D;
        this.obj = this.el.object3D;

        // Optional per-session overrides: ?damp=0.9&settle=700&grace=5000
        var q = new URLSearchParams(location.search);
        ['amount:damp', 'settle:settle', 'grace:grace'].forEach((pair) => {
          var k = pair.split(':'), v = parseFloat(q.get(k[1]));
          if (isFinite(v)) this.el.setAttribute('damp', k[0], v);
        });

        this.basePos = this.obj.position.clone();
        this.baseQuat = this.obj.quaternion.clone();
        this.baseScale = this.obj.scale.clone();
        this.baseMat = new THREE.Matrix4().compose(this.basePos, this.baseQuat, this.baseScale);

        this.smPos = new THREE.Vector3();
        this.smQuat = new THREE.Quaternion();
        this.primed = false;

        // Freeze state
        this.locked = false;
        this.frozenWorld = new THREE.Matrix4();      // captured world pose
        this.stableSince = 0;
        this.lostSince = 0;

        this._p = new THREE.Vector3();
        this._q = new THREE.Quaternion();
        this._s = new THREE.Vector3();
        this._m = new THREE.Matrix4();

        this.target.addEventListener('targetFound', () => {
          this.primed = false;
          this.locked = false;
          this.stableSince = 0;
          this.lostSince = 0;
        });
        this.target.addEventListener('targetLost', () => {
          this.lostSince = performance.now();
        });
      },

      tick: function (time) {
        const THREE = AFRAME.THREE;
        const visible = this.targetObj && this.targetObj.visible;

        // ---- FROZEN: hold the captured world pose regardless of tracking ----
        if (this.locked) {
          // Unfreeze only after the card has been gone continuously for `grace`.
          if (!visible && this.lostSince && (performance.now() - this.lostSince > this.data.grace)) {
            this.locked = false;
            this.primed = false;
            return;
          }
          // wrapper local = targetWorld⁻¹ · frozenWorld  → world pose stays put.
          this._m.copy(this.targetObj.matrix).invert().multiply(this.frozenWorld);
          this._m.decompose(this.obj.position, this.obj.quaternion, this.obj.scale);
          return;
        }

        // ---- FOLLOWING: damped ease toward the tracked pose ----
        if (!visible) return;
        this.lostSince = 0;

        this.targetObj.matrix.decompose(this._p, this._q, this._s);
        const a = Math.max(0, Math.min(0.97, this.data.amount));
        const follow = 1 - a;

        if (!this.primed) {
          this.smPos.copy(this._p);
          this.smQuat.copy(this._q);
          this.primed = true;
          this.stableSince = time;
        } else {
          this.smPos.lerp(this._p, follow);
          this.smQuat.slerp(this._q, follow);
        }

        // Render smoothed pose (residual against raw) with base on top.
        this._q.invert();
        this.obj.quaternion.copy(this.smQuat).multiply(this._q).multiply(this.baseQuat);
        this._p.sub(this.smPos).multiplyScalar(-1);
        this.obj.position.copy(this.basePos).add(this._p);
        this.obj.scale.copy(this.baseScale);

        // Once the smoothed pose has tracked closely for `settle` ms, freeze.
        // Closeness = smoothed vs raw agree (jitter no longer moving them apart).
        this.targetObj.matrix.decompose(this._p, this._q, this._s);
        const posErr = this._p.distanceTo(this.smPos);
        const rotErr = this._q.angleTo(this.smQuat);       // radians
        if (posErr < 0.01 && rotErr < 0.03) {
          if (time - this.stableSince > this.data.settle) {
            // Capture current world pose = targetWorld · (base·smoothed offset).
            this.obj.updateMatrix();
            this.frozenWorld.copy(this.targetObj.matrix).multiply(this.obj.matrix);
            this.locked = true;
          }
        } else {
          this.stableSince = time;   // reset the stability timer on any wobble
        }
      }
    });
  </script>

  <!-- Plays whatever the GLB's first animation clip is called, so exported
       clip renames (Idle, Idle.001, Idle.003 …) don't silently stop playback. -->
  <script>
    AFRAME.registerComponent('play-first-clip', {
      init: function () {
        this.el.addEventListener('model-loaded', (e) => {
          const model = e.detail.model;
          const clips = model && model.animations;
          if (!clips || !clips.length) return;
          // Reuse aframe-extras' mixer by handing it the real clip name.
          this.el.setAttribute('animation-mixer', 'clip: ' + clips[0].name + '; loop: repeat');

          // Speed all clips up 50%. timeScale isn't an attribute in this
          // aframe-extras build, so set it on the THREE mixer directly. The
          // mixer may be created synchronously or a tick later, so try now and
          // once more on the next frame.
          const setSpeed = () => {
            const mc = this.el.components['animation-mixer'];
            if (mc && mc.mixer) { mc.mixer.timeScale = 2.7; return true; }
            return false;
          };
          if (!setSpeed()) requestAnimationFrame(setSpeed);
        });
      }
    });
  </script>

  <!-- Look shader: toon / unlit / posterize / dither + inverted-hull outline -->
  <script>
    var crownGlowTex = null;   // shared bloom-sprite texture, built on first use
    AFRAME.registerComponent('crown-shader', {
      schema: {
        mode:         { type: 'string',  default: 'default' },
        bands:        { type: 'number',  default: 3 },
        outline:      { type: 'boolean', default: false },
        outlineWidth: { type: 'number',  default: 0.03 },
        arrowGlow:    { type: 'number',  default: 0 },   // emissive on rim arrow
        bloom:        { type: 'number',  default: 0 }     // fake glow-sprite size (world units)
      },

      init: function () {
        this.orig = new Map();
        this.outlines = [];
        this.el.addEventListener('model-loaded', () => { this.cache(); this.apply(); });
      },

      update: function () { this.apply(); },

      // Remember each mesh's shipped material so every mode stays reversible.
      cache: function () {
        this.orig.clear();
        if (!this.el.object3D) return;
        this.el.object3D.traverse((c) => {
          if (c.isMesh && c.material && !this.orig.has(c.uuid)) this.orig.set(c.uuid, c.material);
        });
      },

      gradientMap: function (steps) {
        const n = Math.max(2, Math.min(8, Math.round(steps)));
        const data = new Uint8Array(n);
        for (let i = 0; i < n; i++) data[i] = Math.round(255 * (i + 1) / n);
        const t = new THREE.DataTexture(data, n, 1, THREE.RedFormat);
        t.minFilter = THREE.NearestFilter;
        t.magFilter = THREE.NearestFilter;
        t.generateMipmaps = false;
        t.needsUpdate = true;
        return t;
      },

      // Quantise (and optionally ordered-dither) the final colour, post-lighting.
      postFX: function (mat, levels, dither) {
        mat.onBeforeCompile = (shader) => {
          shader.fragmentShader = shader.fragmentShader.replace(
            '#include <dithering_fragment>',
            `
            #include <dithering_fragment>
            {
              float lv = ${levels.toFixed(1)};
              float thr = 0.0;
              ${dither ? `
              vec2 dp = floor(gl_FragCoord.xy);
              float di = mod(dp.x + mod(dp.y, 2.0) * 2.0, 4.0);
              thr = (di + 0.5) / 4.0 - 0.5;
              ` : ''}
              gl_FragColor.rgb = floor(gl_FragColor.rgb * lv + 0.5 + thr) / lv;
            }
            `);
        };
        mat.needsUpdate = true;
      },

      clearOutlines: function () {
        this.outlines.forEach((o) => { if (o.parent) o.parent.remove(o); });
        this.outlines = [];
      },

      // Soft radial-gradient texture for the bloom sprite (generated once).
      _glowTexture: function () {
        if (crownGlowTex) return crownGlowTex;
        const s = 128;
        const cv = document.createElement('canvas');
        cv.width = cv.height = s;
        const ctx = cv.getContext('2d');
        const g = ctx.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
        g.addColorStop(0.0, 'rgba(255,255,255,1)');
        g.addColorStop(0.25, 'rgba(255,255,255,0.6)');
        g.addColorStop(0.55, 'rgba(255,255,255,0.2)');
        g.addColorStop(1.0, 'rgba(255,255,255,0)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, s, s);
        crownGlowTex = new AFRAME.THREE.CanvasTexture(cv);
        return crownGlowTex;
      },

      apply: function () {
        if (!this.el.object3D || this.orig.size === 0) return;
        const THREE = AFRAME.THREE;
        const d = this.data;
        this.clearOutlines();

        this.el.object3D.traverse((c) => {
          if (!c.isMesh) return;
          // The 'rim' node is the repurposed down-arrow. Keep it off the toon
          // material, but optionally give it an emissive glow.
          if (c.name && /rim/i.test(c.name)) {
            if (c.material) {
              const g = this.data.arrowGlow;
              if (!c.material.emissive) c.material.emissive = new THREE.Color(0x000000);
              c.material.emissive.copy(c.material.color || new THREE.Color(0xffd24a));
              c.material.emissiveIntensity = g;
              c.material.needsUpdate = true;
            }
            // Fake bloom: a camera-facing additive sprite behind the arrow that
            // bleeds its colour into the surrounding dark. Cheaper and safer
            // than a real bloom pass; reads as radiance on the dark card.
            if (this.data.bloom > 0 && !c.userData._glow) {
              const col = c.material && c.material.color
                ? c.material.color : new THREE.Color(0xffd24a);
              const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
                map: this._glowTexture(),
                color: col,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                transparent: true,
                opacity: 0.9
              }));
              const s = this.data.bloom;
              sprite.scale.set(s, s, s);
              sprite.renderOrder = -1;      // behind the arrow
              c.add(sprite);
              c.userData._glow = sprite;
            } else if (c.userData._glow) {
              const s = this.data.bloom;
              c.userData._glow.visible = s > 0;
              if (s > 0) c.userData._glow.scale.set(s, s, s);
            }
            return;
          }
          const o = this.orig.get(c.uuid);
          if (!o) return;

          if (d.mode === 'toon') {
            c.material = new THREE.MeshToonMaterial({
              color: o.color ? o.color.clone() : new THREE.Color(0xffffff),
              map: o.map || null,
              gradientMap: this.gradientMap(d.bands)
            });
          } else if (d.mode === 'unlit') {
            c.material = new THREE.MeshBasicMaterial({
              color: o.color ? o.color.clone() : new THREE.Color(0xffffff),
              map: o.map || null
            });
          } else if (d.mode === 'posterize' || d.mode === 'dither') {
            const m = o.clone();
            m.flatShading = true;
            this.postFX(m, d.bands * 2, d.mode === 'dither');
            c.material = m;
          } else {
            c.material = o;                 // default: restore original
            o.flatShading = true;
            o.needsUpdate = true;
          }
        });

        if (d.outline) this.buildOutlines();
      },

      // Inverted hull: clone each mesh, scale it up, render back faces in black.
      buildOutlines: function () {
        const w = this.data.outlineWidth;
        const meshes = [];
        this.el.object3D.traverse((c) => { if (c.isMesh && !/rim/i.test(c.name || '')) meshes.push(c); });
        meshes.forEach((m) => {
          const shell = new THREE.Mesh(
            m.geometry,
            new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.BackSide })
          );
          shell.scale.set(1 + w, 1 + w, 1 + w);
          m.add(shell);
          this.outlines.push(shell);
        });
      }
    });
  </script>

</head>
<body>

  <!-- ============ LOADING OVERLAY ============ -->
  <div id="loading-overlay">
    <div class="loading-content">
      <div class="loading-spinner"></div>
      <p class="loading-instruction">Point your camera at a card</p>
    </div>
  </div>

  <!-- ============ RECORDING / ENCODING STATUS ============ -->
  <div id="rec-status" hidden></div>

  <!-- ============ CAMERA CONTROL CLUSTER (centered, thumb zone) ============ -->
  <div id="camera-controls">
    <div id="mode-toggle" role="group" aria-label="Capture mode">
      <button id="mode-photo" type="button" class="mode-seg active" aria-pressed="true">PHOTO</button>
      <button id="mode-gif" type="button" class="mode-seg" aria-pressed="false">GIF</button>
    </div>

    <button id="photo-btn" type="button" aria-label="Capture">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 8.6A1.6 1.6 0 0 1 4.6 7h2.1a1.6 1.6 0 0 0 1.37-.78l.72-1.2A1.6 1.6 0 0 1 10.16 4.2h3.68a1.6 1.6 0 0 1 1.37.78l.72 1.2A1.6 1.6 0 0 0 17.3 7h2.1A1.6 1.6 0 0 1 21 8.6v8.8a1.6 1.6 0 0 1-1.6 1.6H4.6A1.6 1.6 0 0 1 3 17.4z"/>
        <circle cx="12" cy="13" r="3.5"/>
      </svg>
    </button>
  </div>

  <!-- Capture flash -->
  <div id="capture-flash" aria-hidden="true"></div>

  <!-- ============ A-FRAME AR SCENE ============ -->
  <a-scene
    mindar-image="imageTargetSrc: assets/targets.mind; maxTrack: 1;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <!-- Preload GLB models -->
    <a-assets>
      <a-asset-item id="model-blue-magic" src="assets/001-blue-magic.glb"></a-asset-item>
      <a-asset-item id="model-hot-comb" src="assets/002-hot-comb.glb"></a-asset-item>
      <a-asset-item id="model-afro-pick" src="assets/003-afro-pick.glb"></a-asset-item>
      <a-asset-item id="model-hair-relaxer" src="assets/004-hair-relaxer.glb"></a-asset-item>
      <a-asset-item id="model-got2b-glued" src="assets/005-got2b-glued.glb"></a-asset-item>
    </a-assets>

    <!-- Camera -->
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Lighting: tuned for toon banding contrast -->
    <a-light type="ambient" color="#ffffff" intensity="0.6"></a-light>
    <a-light type="directional" color="#ffe8c0" intensity="2.5" position="1 2 1"></a-light>

    <!-- Target 0 — Blue Magic -->
    <a-entity mindar-image-target="targetIndex: 0">
      <a-entity
        class="model-wrap"
        position="0.00 -0.05 0.43"
        damp="amount: 0; settle: 400; grace: 10000"
      >
        <a-gltf-model
          src="#model-blue-magic"
          rotation="15 0 0"
          scale="4.04 4.04 4.04"
          ps1-shader="snapResolution: 0"
          crown-shader="mode: toon; bands: 4; outline: true; outlineWidth: 0.120; arrowGlow: 2; bloom: 0.145"
          play-first-clip
        ></a-gltf-model>
      </a-entity>
    </a-entity>

    <!-- Target 1 — Hot Comb -->
    <a-entity mindar-image-target="targetIndex: 1">
      <a-entity
        class="model-wrap"
        position="0.00 -0.17 0.41"
        damp="amount: 0; settle: 400; grace: 10000"
      >
        <a-gltf-model
          src="#model-hot-comb"
          rotation="5 0 0"
          scale="3.41 3.41 3.41"
          ps1-shader="snapResolution: 0"
          crown-shader="mode: toon; bands: 6; outline: true; outlineWidth: 0.120; arrowGlow: 2; bloom: 0.145"
          play-first-clip
        ></a-gltf-model>
      </a-entity>
    </a-entity>

    <!-- Target 2 — Afro Pick -->
    <a-entity mindar-image-target="targetIndex: 2">
      <a-entity
        class="model-wrap"
        position="0.00 -0.23 0.33"
        damp="amount: 0; settle: 400; grace: 10000"
      >
        <a-gltf-model
          src="#model-afro-pick"
          rotation="5 0 0"
          scale="0.29 0.29 0.29"
          ps1-shader="snapResolution: 0"
          crown-shader="mode: toon; bands: 6; outline: true; outlineWidth: 0.120; arrowGlow: 2; bloom: 1.452"
          play-first-clip
        ></a-gltf-model>
      </a-entity>
    </a-entity>

    <!-- Target 3 — Hair Relaxer -->
    <a-entity mindar-image-target="targetIndex: 3">
      <a-entity
        class="model-wrap"
        position="0.00 -0.02 0.33"
        damp="amount: 0; settle: 400; grace: 10000"
      >
        <a-gltf-model
          src="#model-hair-relaxer"
          rotation="5 0 0"
          scale="0.31 0.31 0.31"
          ps1-shader="snapResolution: 0"
          crown-shader="mode: toon; bands: 6; outline: true; outlineWidth: 0.120; arrowGlow: 2; bloom: 1.452"
          play-first-clip
        ></a-gltf-model>
      </a-entity>
    </a-entity>

    <!-- Target 4 — Got2b Glued -->
    <a-entity mindar-image-target="targetIndex: 4">
      <a-entity
        class="model-wrap"
        position="0.00 -0.10 0.33"
        damp="amount: 0; settle: 400; grace: 10000"
      >
        <a-gltf-model
          src="#model-got2b-glued"
          rotation="5 0 0"
          scale="2.49 2.49 2.49"
          ps1-shader="snapResolution: 0"
          crown-shader="mode: toon; bands: 3; outline: true; outlineWidth: 0.120; arrowGlow: 2; bloom: 0.145"
          play-first-clip
        ></a-gltf-model>
      </a-entity>
    </a-entity>
  </a-scene>

  <!-- ============ OVERLAY FADE LOGIC ============ -->
  <script>
    const sceneEl = document.querySelector('a-scene');
    const overlay = document.getElementById('loading-overlay');

    sceneEl.addEventListener('arReady', () => {
      overlay.classList.add('hidden');
    });

    // Fallback: hide after 8s if arReady never fires (e.g. desktop testing)
    setTimeout(() => {
      overlay.classList.add('hidden');
    }, 8000);
  </script>
  <!-- ============ PHOTO CAPTURE ============ -->
  <script>
    (function () {
      const btn = document.getElementById('photo-btn');
      const flash = document.getElementById('capture-flash');

      // Preload the branding overlay drawn onto every capture. Cover-fit,
      // top-anchored; its transparent regions let the photo show through.
      const overlayImg = new Image();
      let overlayReady = false;
      overlayImg.onload = () => { overlayReady = true; };
      overlayImg.src = 'assets/overlay.png';

      // Composite MindAR's camera video + the WebGL layer into one canvas.
      function composite() {
        const scene = document.querySelector('a-scene');
        const gl = scene && scene.renderer && scene.renderer.domElement;
        const video = document.querySelector('video');
        if (!gl) return null;

        const out = document.createElement('canvas');
        out.width = gl.width;
        out.height = gl.height;
        const ctx = out.getContext('2d');

        // CSS pixels -> canvas pixels
        const s = gl.clientWidth ? gl.width / gl.clientWidth : 1;

        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, out.width, out.height);

        // Camera frame first, using MindAR's own computed geometry
        if (video && video.videoWidth) {
          ctx.drawImage(
            video,
            video.offsetLeft * s, video.offsetTop * s,
            video.offsetWidth * s, video.offsetHeight * s
          );
        }

        // 3D layer on top.
        // The WebGL buffer is cleared once the browser composites, so re-render
        // now and read it in the same synchronous block while it's still valid.
        try {
          scene.renderer.render(scene.object3D, scene.camera);
        } catch (e) {
          console.error('Re-render before capture failed:', e);
        }
        ctx.drawImage(gl, 0, 0, out.width, out.height);

        // Match the live CRT overlay so saved photos look like what's on screen.
        var fx = window.CROWN_POSTFX;
        if (fx && fx.crt > 0) {
          var W = out.width, H = out.height;
          // Scanlines
          ctx.globalAlpha = 0.28 * fx.crt;
          ctx.fillStyle = '#000';
          for (var y = 0; y < H; y += 3) ctx.fillRect(0, y, W, 1);
          ctx.globalAlpha = 1;
          // Vignette
          var g = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.3, W/2, H/2, Math.max(W,H)*0.6);
          g.addColorStop(0, 'rgba(0,0,0,0)');
          g.addColorStop(1, 'rgba(0,0,0,' + (0.5 * fx.crt).toFixed(3) + ')');
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, W, H);
        }

        // Branding overlay, drawn last so it sits on top of everything.
        // Cover-fit (fill width, anchor to top) so the branding stays put
        // regardless of the photo's exact aspect ratio.
        if (overlayReady && overlayImg.width) {
          const oa = overlayImg.height / overlayImg.width;
          const dw = out.width;
          const dh = dw * oa;
          ctx.drawImage(overlayImg, 0, 0, dw, dh);
        }
        return out;
      }

      function dataURLtoBlob(dataURL) {
        const [head, b64] = dataURL.split(',');
        const mime = head.match(/:(.*?);/)[1];
        const bin = atob(b64);
        const buf = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
        return new Blob([buf], { type: mime });
      }

      function filename() {
        const d = new Date();
        const p = (n) => String(n).padStart(2, '0');
        return `crown3d-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}` +
               `-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
      }

      const modePhoto = document.getElementById('mode-photo');
      const modeGif = document.getElementById('mode-gif');
      const recStatus = document.getElementById('rec-status');
      let gifMode = false;
      let recording = false;

      function setMode(gif) {
        if (recording) return;   // don't switch mid-record
        gifMode = gif;
        modePhoto.classList.toggle('active', !gif);
        modeGif.classList.toggle('active', gif);
        modePhoto.setAttribute('aria-pressed', gif ? 'false' : 'true');
        modeGif.setAttribute('aria-pressed', gif ? 'true' : 'false');
      }
      modePhoto.addEventListener('click', () => setMode(false));
      modeGif.addEventListener('click', () => setMode(true));

      function sharePhoto() {
        const canvas = composite();
        if (!canvas) return;
        let blob;
        try {
          blob = dataURLtoBlob(canvas.toDataURL('image/png'));
        } catch (e) { console.error('Capture failed:', e); return; }

        flash.classList.add('firing');
        setTimeout(() => flash.classList.remove('firing'), 320);

        const name = filename() + '.png';
        const file = new File([blob], name, { type: 'image/png' });
        shareOrDownload(blob, file, name, 'image/png');
      }

      function shareOrDownload(blob, file, name, type) {
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          navigator.share({ files: [file], title: 'CROWN3D CARDS' }).catch(() => {});
        } else {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = name;
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 4000);
        }
      }

      // ---- GIF recording ----
      // gif.js spawns a Web Worker; loading gif.worker.js cross-origin from a
      // CDN is blocked by the browser. Fetch it as a blob and pass a local URL.
      let workerBlobURL = null;
      function getWorkerURL() {
        if (workerBlobURL) return Promise.resolve(workerBlobURL);
        return fetch('https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js')
          .then(r => r.text())
          .then(txt => {
            workerBlobURL = URL.createObjectURL(new Blob([txt], { type: 'application/javascript' }));
            return workerBlobURL;
          });
      }

      function recordGif() {
        if (recording) return;
        if (typeof GIF === 'undefined') {
          recStatus.hidden = false;
          recStatus.textContent = 'GIF encoder not loaded';
          setTimeout(() => { recStatus.hidden = true; }, 2500);
          return;
        }
        recording = true;
        modeGif.classList.add('recording');

        const DURATION = 3000;   // ms
        const FPS = 12;
        const MAXW = 720;
        const interval = 1000 / FPS;
        const frames = [];

        // Downscale target keeps file size and encode time sane.
        const src = composite();
        if (!src) { recording = false; modeGif.classList.remove('recording'); return; }
        const scale = Math.min(1, MAXW / src.width);
        const gw = Math.round(src.width * scale);
        const gh = Math.round(src.height * scale);

        const scratch = document.createElement('canvas');
        scratch.width = gw; scratch.height = gh;
        const sctx = scratch.getContext('2d');

        recStatus.hidden = false;
        recStatus.textContent = '● REC 3s';

        const t0 = performance.now();
        let lastGrab = 0;

        function grab(now) {
          if (now - lastGrab >= interval) {
            lastGrab = now;
            const c = composite();
            if (c) {
              sctx.drawImage(c, 0, 0, gw, gh);
              const frameCanvas = document.createElement('canvas');
              frameCanvas.width = gw; frameCanvas.height = gh;
              frameCanvas.getContext('2d').drawImage(scratch, 0, 0);
              frames.push(frameCanvas);
            }
          }
          const elapsed = now - t0;
          if (elapsed < DURATION) {
            const remain = Math.ceil((DURATION - elapsed) / 1000);
            recStatus.textContent = '● REC ' + remain + 's';
            requestAnimationFrame(grab);
          } else {
            encode(frames, gw, gh, interval);
          }
        }
        requestAnimationFrame(grab);
      }

      function encode(frames, gw, gh, delay) {
        recStatus.textContent = 'Encoding… 0%';
        getWorkerURL().then((workerURL) => {
          const gif = new GIF({
            workers: 2, quality: 10, width: gw, height: gh,
            workerScript: workerURL
          });
          frames.forEach(f => gif.addFrame(f, { delay: delay }));
          gif.on('progress', (p) => {
            recStatus.textContent = 'Encoding… ' + Math.round(p * 100) + '%';
          });
          gif.on('finished', (blob) => {
            recStatus.hidden = true;
            recording = false;
            modeGif.classList.remove('recording');
            const name = filename() + '.gif';
            const file = new File([blob], name, { type: 'image/gif' });
            shareOrDownload(blob, file, name, 'image/gif');
          });
          gif.render();
        }).catch((e) => {
          console.error('GIF worker load failed:', e);
          recStatus.textContent = 'GIF failed';
          recording = false;
          modeGif.classList.remove('recording');
          setTimeout(() => { recStatus.hidden = true; }, 2500);
        });
      }

      btn.addEventListener('click', function () {
        if (gifMode) recordGif();
        else sharePhoto();
      });
    })();
  </script>
  <!-- ============ POST-FX: pixelation + CRT overlay ============ -->
  <div id="crt-overlay" aria-hidden="true"></div>
  <script>
    (function () {
      // Screen pixelation: render at a lower pixel ratio, upscale hard-edged.
      // CRT: a scanline + vignette overlay on top of the whole view (which
      // includes MindAR's camera video, since the overlay sits above it).
      var PIXEL = 2;      // 1 = crisp, higher = chunkier
      var CRT   = 0.15;   // 0 = off .. 1 = strong

      var scene = document.querySelector('a-scene');

      function applyPixel() {
        var r = scene.renderer, c = scene.canvas;
        if (r && PIXEL > 1) {
          var base = Math.min(window.devicePixelRatio || 1, 2);
          r.setPixelRatio(base / PIXEL);
          if (c) c.style.imageRendering = 'pixelated';
        }
      }
      // MindAR resets the renderer size when AR starts, so (re)apply after ready.
      scene.addEventListener('renderstart', applyPixel);
      scene.addEventListener('arReady', applyPixel);

      var ov = document.getElementById('crt-overlay');
      ov.style.opacity = CRT;

      // Expose for the photo capture so saved shots match the live view.
      window.CROWN_POSTFX = { pixel: PIXEL, crt: CRT };
    })();
  </script>
